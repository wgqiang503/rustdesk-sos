name: SOS Windows x64 validation

on:
  push:
    branches:
      - sos/windows-x64-validation
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  RUST_TARGET: x86_64-pc-windows-msvc
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      include-arm: false

  topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build:
    needs: [bridge, topmost-window]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Restore generated bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: .

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "15.0.6"

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Use the same Flutter engine and dropdown patch as the x64 release build
        shell: pwsh
        env:
          FLUTTER_ROOT: ${{ steps.flutter.outputs['CACHE-PATH'] }}
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          $engineZip = Join-Path $env:RUNNER_TEMP 'windows-x64-release.zip'
          $engineDir = Join-Path $env:RUNNER_TEMP 'sos-flutter-engine'
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile $engineZip
          Expand-Archive -LiteralPath $engineZip -DestinationPath $engineDir -Force
          Copy-Item "$engineDir/*" "$env:FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release/" -Force -Recurse
          $patch = Join-Path $PWD '.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff'
          git -C $env:FLUTTER_ROOT apply $patch

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.RUST_TARGET }}
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: sos-windows-x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install native dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "$VCPKG_DEFAULT_HOST_TRIPLET" --x-install-root="$VCPKG_ROOT/installed"

      - name: Build the Flutter payload
        shell: pwsh
        run: |
          python ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { throw 'Flutter payload build failed' }
          Move-Item ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Run the SOS regression tests
        shell: bash
        run: |
          run_sos_tests() {
            local log
            log=$(mktemp)
            cargo test --locked --release --lib --color never "$@" sos_ | tee "$log"
            if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$log"; then
              echo 'No SOS regression tests ran' >&2
              return 1
            fi
          }
          features=$(python ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          run_sos_tests --features "$features"
          run_sos_tests -p hbb_common --features sos-server

      - name: Restore the x64 window integration DLL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Create and verify the self-extracting SOS executable
        shell: bash
        run: |
          for file in rustdesk.exe librustdesk.dll flutter_windows.dll WindowInjection.dll data/app.so data/icudtl.dat; do
            if [[ ! -s "rustdesk/$file" ]]; then
              echo "Missing or empty Windows payload file: rustdesk/$file" >&2
              exit 1
            fi
          done
          runner_res=$(find flutter/build/windows/x64 -iname Runner.res -type f -print -quit)
          if [[ ! -s "$runner_res" ]]; then
            echo 'Missing Windows runner resource: Runner.res' >&2
            exit 1
          fi
          cp "$runner_res" ./libs/portable/Runner.res
          sed -i '/dpiAware/d' res/manifest.xml
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py -f rustdesk -o libs/portable -e rustdesk/rustdesk.exe -t "$RUST_TARGET"
          mkdir -p artifacts
          cp "target/$RUST_TARGET/release/rustdesk-portable-packer.exe" artifacts/meiming-sos.exe
          test -s artifacts/meiming-sos.exe
          cd artifacts
          sha256sum meiming-sos.exe > meiming-sos.exe.sha256
          sha256sum -c meiming-sos.exe.sha256

      - name: Upload unsigned validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meiming-sos-windows-x64
          path: |
            artifacts/meiming-sos.exe
            artifacts/meiming-sos.exe.sha256
          if-no-files-found: error
